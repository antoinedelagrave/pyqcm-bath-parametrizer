[project]
name = "bath-parametrizer"
version = "0.1.0"
description = "Symmetry-based utility to treat Pyqcm's clusters."
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bath_parametrizer"]
